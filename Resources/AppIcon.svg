<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2a3fb0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454952"/>
      <stop offset="0.5" stop-color="#25282e"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a909b"/>
      <stop offset="0.5" stop-color="#3a3e46"/>
      <stop offset="1" stop-color="#6d737e"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3b4fa8"/>
      <stop offset="0.45" stop-color="#1a1f4a"/>
      <stop offset="1" stop-color="#05060d"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.7" stop-color="#0a0c1c"/>
      <stop offset="1" stop-color="#2b2f6e"/>
    </radialGradient>
    <linearGradient id="yoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="0.5" stop-color="#4a4e57"/>
      <stop offset="1" stop-color="#1c1e22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- background tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#squircle)">
    <ellipse cx="512" cy="100" rx="560" ry="300" fill="#fff" opacity="0.10" filter="url(#shadow)"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="512" cy="822" rx="210" ry="30" fill="#000" opacity="0.45" filter="url(#shadow)"/>

  <!-- stem -->
  <rect x="476" y="640" width="72" height="128" rx="14" fill="url(#yoke)"/>

  <!-- base puck -->
  <rect x="352" y="764" width="320" height="48" rx="24" fill="#16181c"/>
  <ellipse cx="512" cy="768" rx="160" ry="20" fill="#3a3e46"/>
  <ellipse cx="512" cy="764" rx="36" ry="8" fill="#1c1e22"/>


  <!-- gimbal yoke -->
  <path d="M 296 470 L 296 586 Q 296 676 386 676 L 638 676 Q 728 676 728 586 L 728 470"
        fill="none" stroke="url(#yoke)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="296" cy="500" r="26" fill="#2e3137" stroke="#5a5f69" stroke-width="4"/>
  <circle cx="728" cy="500" r="26" fill="#2e3137" stroke="#5a5f69" stroke-width="4"/>

  <!-- head -->
  <rect x="318" y="246" width="388" height="388" rx="96" fill="url(#head)"/>
  <rect x="326" y="254" width="372" height="372" rx="90" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- lens -->
  <circle cx="512" cy="440" r="146" fill="#0b0c0f"/>
  <circle cx="512" cy="440" r="126" fill="url(#metal)"/>
  <circle cx="512" cy="440" r="108" fill="url(#glass)"/>
  <circle cx="512" cy="440" r="56" fill="url(#iris)"/>
  <circle cx="512" cy="440" r="80" fill="none" stroke="#6f7cff" stroke-opacity="0.25" stroke-width="3"/>
  <ellipse cx="470" cy="398" rx="38" ry="24" fill="#fff" opacity="0.55" transform="rotate(-35 470 398)"/>
  <circle cx="556" cy="488" r="9" fill="#fff" opacity="0.35"/>

  <!-- status LED -->
  <circle cx="640" cy="296" r="13" fill="#4dd8ff" filter="url(#glow)"/>
  <circle cx="640" cy="296" r="8" fill="#bff3ff"/>
</svg>
